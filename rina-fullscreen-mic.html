  W = Math.round(innerWidth*DPR); H = Math.round(innerHeight*DPR);
  canvas.width=W; canvas.height=H; canvas.style.width=innerWidth+'px'; canvas.style.height=innerHeight+'px';
  const minDim=Math.min(W,H);
  line=Math.max(1,Math.round(DPR));
  cell=Math.max(4, Math.floor((minDim*0.82)/26) - line);
  const step=cell+line;
  cols=Math.ceil(W/step)+2; rows=Math.ceil(H/step)+2;
  startX=Math.round((W-(cols*step+line))/2);
  startY=Math.round((H-(rows*step+line))/2);
  fcStart=Math.floor((cols-COLS)/2); frStart=Math.floor((rows-ROWS)/2);
  [fr,fg,fb]=hex(COLOR);
}
function draw(){
  const grid=activeGrid(), step=cell+line, faceFill=`rgb(${fr},${fg},${fb})`;
  ctx.fillStyle='#d5d5d5'; ctx.fillRect(0,0,W,H);
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const gr=r-frStart, gc=c-fcStart; let v=0;
    if(gr>=0&&gr<ROWS&&gc>=0&&gc<COLS) v=grid[gr][gc];
    ctx.fillStyle=v?faceFill:'#ffffff';
    ctx.fillRect(startX+line+c*step, startY+line+r*step, cell, cell);
  }
}

/* ---- random eye switching ---- */
function nextEyes(){
  let n; do{ n=POOL[(Math.random()*POOL.length)|0]; }while(n===currentEyes&&POOL.length>1);
  currentEyes=n;
  setTimeout(nextEyes, 1600 + Math.random()*3000);   // 1.6s – 4.6s
}

/* ---- audio ---- */
let audioCtx, analyser, dataArr, micStream;
const ov=document.getElementById('ov'), msg=document.getElementById('msg'), startBtn=document.getElementById('start');

async function begin(){
  // fullscreen on the user gesture
  try{ const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el); }catch(e){}

  if(!window.isSecureContext && location.protocol!=='file:'){
    return fail('This page must be opened over <b>https://</b> or as a local <b>file</b> for mic access. Inside an embedded preview the mic is blocked.');
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    return fail('This browser/context exposes no microphone API. Download the file and open it directly in Chrome, Edge, Firefox or Safari.');
  }
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') await audioCtx.resume();
    const src=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0;
    src.connect(analyser); dataArr=new Float32Array(analyser.fftSize);
    running=true; ov.classList.add('gone'); poke();
  }catch(e){
    const why = e&&e.name==='NotAllowedError' ? 'Permission was denied. Click the address-bar mic/lock icon, allow the microphone, then tap start again.'
              : e&&e.name==='NotFoundError'  ? 'No microphone was found on this device.'
              : 'Could not open the microphone. If this is an embedded preview, download the file and open it directly.';
    fail(why);
  }
}
function fail(html){
  msg.innerHTML=html; msg.classList.add('err');
  startBtn.textContent='↻ RETRY';
}
startBtn.addEventListener('click', begin);

/* ---- main loop ---- */
function loop(){
  let target=0;
  if(running && analyser){
    analyser.getFloatTimeDomainData(dataArr);
    let s=0; for(let i=0;i<dataArr.length;i++) s+=dataArr[i]*dataArr[i];
    const rms=Math.sqrt(s/dataArr.length);
    target = rms <= GATE ? 0 : Math.min(MAX_OPEN, (rms - GATE) * GAIN);
    const a = target>openness ? (1-SMOOTH*0.55) : (1-SMOOTH);
    openness += (target-openness)*Math.max(0.08,a);
  } else openness=0;
  level=Math.max(0,Math.min(4,Math.round(openness*4)));
  draw();
  requestAnimationFrame(loop);
}

/* cursor hide */
let idle;
function poke(){ document.body.classList.remove('hide-cursor'); clearTimeout(idle); idle=setTimeout(()=>document.body.classList.add('hide-cursor'),2000); }
window.addEventListener('mousemove', poke);
window.addEventListener('resize', ()=>{layout();draw();});

layout(); draw(); nextEyes(); loop();
</script>
</body>
